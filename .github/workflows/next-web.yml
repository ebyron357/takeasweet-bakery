name: Next.js Web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/next-web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/next-web.yml"

permissions:
  contents: read

concurrency:
  group: next-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Verify safe deployment configuration
        env:
          NEXT_PUBLIC_SITE_URL: https://takeasweet.example.invalid
          PAYMENTS_ENABLED: "false"
          CUSTOM_ORDER_REQUESTS_ENABLED: "false"
          SEARCH_INDEXING_ENABLED: "false"
        run: npm run deployment:check
      - run: npm run build
      - run: npm run quality:audit
