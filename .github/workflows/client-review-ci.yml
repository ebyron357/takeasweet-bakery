name: Client Review CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/client-review-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/client-review-ci.yml"

permissions:
  contents: read

concurrency:
  group: client-review-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install browser for public frontend checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Scroll Craft public guide
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 3113 > /tmp/frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3113/order-info > /dev/null; then break; fi
            sleep 1
          done
          SCROLL_BASE=http://127.0.0.1:3113 node scripts/scroll-craft-qa.mjs

      - name: Site QA (accessibility, layout, page errors)
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 3114 > /tmp/site-qa.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3114/ > /dev/null; then break; fi
            sleep 1
          done
          QA_BASE=http://127.0.0.1:3114 node scripts/site-qa.mjs
